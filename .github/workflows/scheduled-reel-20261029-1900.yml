name: scheduled-reel-20261029-1900

# 일회성 예약: 2026-10-29 19:00 KST. 발행 확인 후 schedule_reel.sh --cleanup 2026-10-29 로 지운다.
on:
  schedule:
    - cron: "7 10 29 10 *"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - id: chk
        run: echo "today=$(TZ=Asia/Seoul date +%F)" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        if: steps.chk.outputs.today == '2026-10-29'
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.today == '2026-10-29'
        with:
          python-version: "3.12"
      - name: 릴스 게시
        if: steps.chk.outputs.today == '2026-10-29'
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TARGET_FOLDER: "2026-10-29 캣타워대신택배상자에들어가는고양이"
        run: python publish_reel.py
      - name: 올린 폴더 정리 커밋
        if: steps.chk.outputs.today == '2026-10-29'
        run: |
          git config user.name  "autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "published reel $(date +%F)"
          git pull --rebase origin main || true
          git push
