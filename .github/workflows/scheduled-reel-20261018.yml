name: scheduled-reel-20261018

# 일회성 예약: 2026-10-18(일) 19:07 KST(10:07 UTC)에 구름 편 릴스 발행.
# 발행 후 이 파일은 삭제한다(매년 같은 날 다시 돌지 않도록 날짜 확인도 넣음).
on:
  schedule:
    - cron: "7 10 18 10 *"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 날짜 확인 (2026-10-18 KST만)
        id: chk
        run: |
          d=$(TZ=Asia/Seoul date +%F)
          echo "today=$d" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.chk.outputs.today == '2026-10-18'

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.today == '2026-10-18'
        with:
          python-version: "3.12"

      - name: 릴스 게시
        if: steps.chk.outputs.today == '2026-10-18'
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TARGET_FOLDER: "2026-10-19 구름무게코끼리100마리"
        run: python publish_reel.py

      - name: 올린 폴더 정리 커밋
        if: steps.chk.outputs.today == '2026-10-18'
        run: |
          git config user.name  "autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "published reel $(date +%F)"
          git pull --rebase origin main || true
          git push
