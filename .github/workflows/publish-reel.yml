name: publish-reel

# 릴스는 예약 없이 수동으로만 올린다. reels/<폴더>/ 에 reel.mp4 · cover.jpg · caption.txt 를 넣고 실행.
on:
  workflow_dispatch:
    inputs:
      folder:
        description: "올릴 릴스 폴더(예: 2026-10-06 청년미래적금)"
        required: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 릴스 게시
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TARGET_FOLDER: ${{ github.event.inputs.folder }}
        run: python publish_reel.py

      - name: 올린 폴더 정리 커밋
        run: |
          git config user.name  "autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          git add -A reels published-reels
          git diff --staged --quiet || git commit -m "published reel $(date +%F)"
          git pull --rebase origin main || true
          git push
