name: publish

on:
  # KST 일·화·금 18:07 (= UTC 09:07). 정각은 깃허브 예약이 몰려서 지연되므로 07분으로 둔다.
  # 깃허브 예약은 가끔 늦거나 통째로 건너뛰므로(2026-10-04 실제로 건너뜀) 같은 날 백업 실행 2번을 더 둔다.
  # 이미 올라가서 발행전 폴더가 옮겨졌으면 백업은 "올릴 폴더가 없습니다"만 찍고 끝나므로 중복 게시되지 않는다.
  schedule:
    - cron: "7 9 * * 0,2,5"
    - cron: "37 9 * * 0,2,5"
    - cron: "7 10 * * 0,2,5"
    # 깃허브 예약은 늦거나 통째로 빠진다(2026-10-30·11-01 실제 발생). 같은 날 저녁에 한 시간 간격으로 더 걸어 둔다.
    # 이미 올라간 날은 "올릴 폴더가 없습니다"만 찍고 끝나므로 중복 게시되지 않는다.
    - cron: "7 11 * * 0,2,5"
    - cron: "7 12 * * 0,2,5"
    - cron: "7 13 * * 0,2,5"
    - cron: "7 14 * * 0,2,5"
    # 매일 낮 12:07(KST)에도 한 번: 어제까지 못 나간 폴더(3일 안)를 publish.py가 대신 올린다.
    - cron: "7 3 * * *"
  workflow_dispatch:
    inputs:
      folder:
        description: "즉시 올릴 폴더(예: 2026-10-13 또는 2026-10-13 도라에몽명대사). 비우면 오늘 날짜 폴더를 올림"
        required: false
        default: ""

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 인스타 게시
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TARGET_FOLDER: ${{ github.event.inputs.folder }}
          CATCHUP_ONLY: ${{ github.event.schedule == '7 3 * * *' }}
        run: python publish.py

      - name: 올린 폴더 정리 커밋
        run: |
          git config user.name  "autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "published $(date +%F)"
          git pull --rebase origin main || true
          git push
