name: publish

on:
  # KST 화·금 18:07 (= UTC 09:07). 정각은 깃허브 예약이 몰려서 지연되므로 07분으로 둔다.
  schedule:
    - cron: "7 9 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 인스타 게시
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python publish.py

      - name: 올린 폴더 정리 커밋
        run: |
          git config user.name  "autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "published $(date +%F)"
          git push
