name: publish-short

# 유튜브 쇼츠는 예약 없이 수동으로만 올린다. 릴스 폴더(릴스업로드대기/ 또는 릴스업로드완료/)의 reel.mp4 를 그대로 쓴다.
on:
  workflow_dispatch:
    inputs:
      folder:
        description: "올릴 폴더(예: 2026-10-06 청년미래적금)"
        required: true
      privacy:
        description: "공개 상태 (public / unlisted / private)"
        required: false
        default: "public"

concurrency:
  group: publish-short
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 유튜브 쇼츠 업로드
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TARGET_FOLDER: ${{ github.event.inputs.folder }}
          YT_PRIVACY: ${{ github.event.inputs.privacy }}
        run: python publish_short.py

      - name: 업로드 기록 커밋
        run: |
          git config user.name  "autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "uploaded short $(date +%F)"
          git pull --rebase origin main || true
          git push
