name: scheduled-reel-20261104-1900

# 일회성 예약: 2026-11-04 19:00 KST — 2026-11-04 위스키에물몇방울
# cron 4번(+7·+25·+45·+75분, UTC). 앞 실행이 올리면 뒤 실행은 건너뜀. 발행 확인 후 schedule_reel.sh --cleanup 2026-11-04
on:
  schedule:
    - cron: "7 10 4 11 *"
    - cron: "25 10 4 11 *"
    - cron: "45 10 4 11 *"
    - cron: "15 11 4 11 *"
  workflow_dispatch:

concurrency:
  group: publish-reel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - id: chk
        run: echo "today=$(TZ=Asia/Seoul date +%F)" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        if: steps.chk.outputs.today == '2026-11-04'
        with:
          ref: main
      - id: todo
        if: steps.chk.outputs.today == '2026-11-04'
        env:
          TARGET_FOLDER: "2026-11-04 위스키에물몇방울"
        run: |
          if [ -d "릴스업로드대기/$TARGET_FOLDER" ]; then echo "go=1" >> $GITHUB_OUTPUT; else echo "이미 발행됨(또는 폴더 없음) — 건너뜀"; fi
      - uses: actions/setup-python@v5
        if: steps.todo.outputs.go == '1'
        with:
          python-version: "3.12"
      - name: 릴스 게시
        if: steps.todo.outputs.go == '1'
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TARGET_FOLDER: "2026-11-04 위스키에물몇방울"
        run: python publish_reel.py
      - name: 올린 폴더 정리 커밋
        if: steps.todo.outputs.go == '1'
        run: |
          git config user.name  "autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "published reel $(date +%F)"
          git pull --rebase origin main || true
          git push
